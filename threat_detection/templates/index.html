{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beautiful Side Navbar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-image: url("{% static 'img/1.jpg' %}");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center center;
    background-attachment: fixed; /* Optional: makes background stay still on scroll */
  }
    /* Button to open the sidebar */
    .openbtn {
      font-size: 20px;
      cursor: pointer;
      background-color: #4A90E2;
      color: white;
      padding: 10px 20px;
      border: none;
      position: fixed;
      top: 20px;
      left: 20px;
      border-radius: 8px;
      z-index: 2;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    /* Sidebar styling */
    .sidebar {
      height: 100%;
      width: 0;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #34495e;
      overflow-x: hidden;
      transition: 0.3s;
      padding-top: 60px;
      z-index: 1;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.2);
    }

    .sidebar a {
      padding: 15px 30px;
      text-decoration: none;
      font-size: 18px;
      color: #ecf0f1;
      display: block;
      transition: 0.3s;
    }

    .sidebar a:hover {
      background-color: #2c3e50;
      color: #f1c40f;
    }

    .closebtn {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 30px;
      color: #fff;
    }

    .closebtn:hover {
      color: #e74c3c;
    }

    /* Add a overlay to darken the background when the sidebar is opened */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s, opacity 0.3s;
    }

    .overlay.show {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>

<!-- Open Button -->
<button class="openbtn" onclick="openNav()">☰ Menu</button>
<!-- Sidebar -->
<div id="mySidebar" class="sidebar">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
  <a href="{% url 'home' %}">Home</a>
  <a href="{% url 'register' %}">Register</a>
  <a href="{% url 'adminlogin' %}">Admin</a>
  <a href="{% url 'userlogin' %}">User</a>
</div>

<!-- Overlay to darken background -->
<div id="overlay" class="overlay" onclick="closeNav()"></div>

{% block content %}

{% endblock %}

<!-- JavaScript to open/close -->
<script>
  function openNav() {
    document.getElementById("mySidebar").style.width = "250px";
    document.getElementById("overlay").classList.add("show");
  }

  function closeNav() {
    document.getElementById("mySidebar").style.width = "0";
    document.getElementById("overlay").classList.remove("show");
  }
</script>

</body>
</html>
