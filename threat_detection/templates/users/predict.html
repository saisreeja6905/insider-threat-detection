{% extends 'users/userbase.html' %}
{% load static %}

{% block content %}
<style>
    

    form {
        width: 60%;
        max-width: 700px;
        margin: 50px auto;
        padding: 30px;
        background: #2a2a3d;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        border-radius: 15px;
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 28px;
        color: #ffffff;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: 500;
        font-size: 16px;
        color: #ccc;
    }

    input, select {
        width: 100%;
        padding: 10px 12px;
        margin-top: 6px;
        border: none;
        border-radius: 8px;
        background-color: #3b3b4f;
        color: #fff;
        font-size: 15px;
        transition: background 0.3s;
    }

    input:focus, select:focus {
        background-color: #4c4c65;
        outline: none;
    }

    button {
        display: block;
        width: 100%;
        padding: 12px;
        margin-top: 30px;
        background: linear-gradient(to right, #5c6bc0, #7986cb);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    button:hover {
        background: linear-gradient(to right, #7986cb, #5c6bc0);
    }

    .result {
        text-align: center;
        font-size: 22px;
        margin-top: 40px;
        padding: 20px;
        background-color: #3a3a50;
        border-radius: 12px;
        width: 60%;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        color: #90caf9;
    }
</style>
<br><br><br><br>
<h2>Predict Cyber Attack Type</h2>
<form method="post">
    {% csrf_token %}
    <label>Country</label>
    <input type="text" name="Country" required>

    <label>Year</label>
    <input type="number" name="Year" required>

    <label>Target Industry</label>
    <input type="text" name="Target Industry" required>

    <label>Financial Loss (in Million $)</label>
    <input type="number" step="0.01" name="Financial Loss" required>

    <label>Number of Affected Users</label>
    <input type="number" name="Number of Affected Users" required>

    <label>Attack Source</label>
    <input type="text" name="Attack Source" required>

    <label>Security Vulnerability Type</label>
    <input type="text" name="Security Vulnerability Type" required>

    <label>Defense Mechanism Used</label>
    <input type="text" name="Defense Mechanism Used" required>

    <label>Incident Resolution Time (in Hours)</label>
    <input type="number" step="0.01" name="Incident Resolution Time" required>

    <button type="submit">Predict Attack Type</button>
</form>

{% if prediction %}
<div class="result">
    <p><strong>Predicted Attack Type:</strong> {{ prediction }}</p>
</div>
{% endif %}
{% endblock %}
